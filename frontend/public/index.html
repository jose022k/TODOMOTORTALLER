<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffaa00">
    <meta name="description" content="Todomotortaller - Sistema de gestión del taller">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Todomotortaller">
    <meta name="format-detection" content="telephone=no">
    <meta name="application-name" content="Todomotortaller">
    <meta name="msapplication-TileColor" content="#1a1a1a">
    <link rel="icon" type="image/png" sizes="192x192" href="<%= BASE_URL %>img/icons/logo-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="<%= BASE_URL %>img/icons/logo-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>img/icons/apple-touch-icon.png">
    <link rel="mask-icon" href="<%= BASE_URL %>img/icons/safari-pinned-tab.svg" color="#ffaa00">
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    <title>TODOMOTORTALLER</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="splash-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity 0.4s ease;">
      <img src="<%= BASE_URL %>img/logo-splash.png" alt="Todomotortaller" style="width:120px;height:120px;object-fit:contain;border-radius:16px;" />
    </div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) { splash.style.opacity = '0'; setTimeout(function(){ splash.remove(); }, 400); }
        }, 800);
      });
    </script>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
